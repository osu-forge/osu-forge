version: 2

# Note: the license gate (.github/workflows/license-gate.yml) runs on every
# Dependabot PR, so a cargo or pip bump that pulls in a copyleft transitive
# dependency fails CI rather than merging quietly. The gate has no npm job, so
# the allowlist in web/'s `licenses` script is not enforced on an npm bump.

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    groups:
      rust-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "web"]
    groups:
      web-minor:
        update-types: ["minor", "patch"]
    # playwright-core has to equal PLAYWRIGHT_VERSION in
    # .github/workflows/ci.yml, which installs the browser build the library
    # speaks to, and Dependabot cannot edit a workflow from an npm PR. So every
    # update type is refused, patch included: a library one patch ahead of its
    # browser build turns the end-to-end job red exactly as a minor bump does,
    # and folded into the group above it would arrive inside a PR that reads
    # like a routine chore. A human moves this version, in the same commit that
    # moves ci.yml.
    ignore:
      - dependency-name: playwright-core

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
