name: License gate

# osu-forge ships under Apache-2.0. A copyleft dependency anywhere in the tree
# would relicense the whole project, so this gate fails the build rather than
# letting one in. See CONTRIBUTING.md "Policy 1 — Dependency licenses".

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a transitive dependency that changes its license is caught even
    # when nobody is pushing.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  rust-licenses:
    name: cargo-deny
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Check dependency licenses, sources and advisories
        run: cargo deny check licenses sources advisories bans

  python-licenses:
    name: pip-licenses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install core
        run: |
          python -m pip install --upgrade pip
          pip install ./core
          pip install pip-licenses
      # The check lives in a script rather than inline here so it can be run and
      # tested locally. The inline version this replaced printed "all licenses
      # are on the allowlist" while pip-licenses had actually failed and returned
      # nothing — a gate that inspects zero packages and reports success.
      - name: Fail on copyleft dependencies
        shell: pwsh
        run: .github/scripts/check-python-licenses.ps1
