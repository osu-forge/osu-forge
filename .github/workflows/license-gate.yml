name: License gate

# osu-forge ships under Apache-2.0. A copyleft dependency anywhere in the tree
# would relicense the whole project, so this gate fails the build rather than
# letting one in. See CONTRIBUTING.md "Policy 1 — Dependency licenses".

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a transitive dependency that changes its license is caught even
    # when nobody is pushing.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  rust-licenses:
    name: cargo-deny
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Check dependency licenses, sources and advisories
        run: cargo deny check licenses sources advisories bans

  python-licenses:
    name: pip-licenses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install core
        run: |
          python -m pip install --upgrade pip
          pip install ./core
          pip install pip-licenses
      - name: Fail on copyleft dependencies
        shell: pwsh
        run: |
          # Allowlist, not denylist — fails closed. A dependency whose license
          # cannot be determined is a failure, not a pass: absent a license,
          # default copyright reserves all rights.
          $allowed = @(
            'Apache Software License','Apache-2.0','Apache 2.0',
            'MIT License','MIT','MIT-0',
            'BSD License','BSD-2-Clause','BSD-3-Clause',
            'ISC License (ISCL)','ISC',
            'Mozilla Public License 2.0 (MPL 2.0)','MPL-2.0',
            'Python Software Foundation License',
            'The Unlicense (Unlicense)','Unlicense',
            'zlib/libpng License','Zlib',
            'CC0 1.0 Universal (CC0 1.0) Public Domain Dedication',
            'Historical Permission Notice and Disclaimer (HPND)'
          )
          $rows = pip-licenses --format=json --with-system=false | ConvertFrom-Json
          $bad = $rows | Where-Object {
            $lic = $_.License
            (-not $lic) -or ($lic -eq 'UNKNOWN') -or
            ($allowed -notcontains $lic -and ($allowed | Where-Object { $lic -like "*$_*" }).Count -eq 0)
          }
          if ($bad) {
            Write-Host "Disallowed or undeterminable licenses found:"
            $bad | ForEach-Object { Write-Host ("  {0} {1} -> {2}" -f $_.Name, $_.Version, $_.License) }
            exit 1
          }
          Write-Host "All Python dependency licenses are on the allowlist."
