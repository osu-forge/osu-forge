[workspace]
resolver = "2"
members = [
    "engine",
    "diffcalc",
    "diffcalc/pyo3",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/osu-forge/osu-forge"
authors = ["osu-forge contributors"]

[workspace.dependencies]
# windows-sys rather than the `windows` crate: the engine needs about eight
# functions, and the Result/HSTRING wrapper machinery is compile time we do not
# need to pay for.
windows-sys = "0.61"
memchr = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
# Keep binaries small and stripped, but do NOT pack or obfuscate — both make AV
# heuristics worse, and we already fight enough false positives.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Aborting on panic makes the engine binary smaller, and it is the one artifact
# we code-sign and ship on its own. It cannot go on `release` above: `panic` is
# not overridable per package, and the PyO3 extension module has to unwind. PyO3
# turns a Rust panic into a Python exception by catching the unwind, so under
# `abort` an unexpected panic on a malformed beatmap would take the whole
# interpreter down with no traceback. Build the engine with
# `--profile engine-release`.
[profile.engine-release]
inherits = "release"
panic = "abort"
